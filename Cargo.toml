[package]
name = "configsync"
version = "0.5.0"
edition = "2021"
authors = ["Michal Švrček"]
description = "Profile-based developer configuration backups"
license = "MIT"

[[bin]]
name = "csync"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
chrono = { version = "0.4", features = ["clock"] }

walkdir = "2"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
