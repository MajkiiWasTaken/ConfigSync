name: ConfigSync Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: ConfigSync-windows-x86_64
          - os: ubuntu-latest
            name: ConfigSync-linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo build --release
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/csync.exe, scripts/install.ps1, scripts/uninstall.ps1, README.md, LICENSE, config.example.toml dist/
          Compress-Archive dist/* ConfigSync-windows-x86_64.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/csync scripts/install.sh scripts/uninstall.sh README.md LICENSE config.example.toml dist/
          tar -czf ConfigSync-linux-x86_64.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ConfigSync-*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
