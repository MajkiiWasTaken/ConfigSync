# Copy to %APPDATA%\ConfigSync\config.toml (Windows)
# or ~/.config/configsync/config.toml (Linux).
# Source paths can be individual files or complete directories.
# Only explicitly configured paths are copied. Do not include credentials, SSH keys or tokens.

[profiles.development]
description = "Development machine preferences"
[profiles.development.files]
gitconfig = "~/.gitconfig"
