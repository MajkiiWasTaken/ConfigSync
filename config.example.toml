# Copy to %APPDATA%\ConfigSync\config.toml on Windows
# or ~/.config/configsync/config.toml on Linux.
# Only explicitly listed files are backed up. Never add private keys or tokens.

[profiles.development]
description = "Development machine preferences"
[profiles.development.files]
gitconfig = "~/.gitconfig"
# vscode_settings = '${APPDATA}/Code/User/settings.json'
# vscode_keybindings = '${APPDATA}/Code/User/keybindings.json'

[profiles.personal]
description = "Personal configuration"
[profiles.personal.files]
example = "~/.gitconfig"   # Replace with a real non-sensitive file
